<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOU 서명 출장 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 왼쪽은 노선도식 일정 레일, 오른쪽은 지도. 폰에서는 지도 위, 레일 아래. */
:root{
 --paper:#f6f7f9;--sheet:#ffffff;--ink:#141a22;--sub:#5b6573;--rule:#e2e5ea;--soft:#eef1f5;
 --route:#2b59c3;--visit:#141a22;--stay:#0f7a55;--warn:#a2470e;--focus:#e8eefc;
 --l1:#0052a4;--l2:#00a84d;--l4:#00a5de;--ktx:#5b6573;
 --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --mono:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1318;--sheet:#161b22;--ink:#e8ebef;--sub:#9aa4b1;--rule:#262d37;--soft:#1d242d;--route:#7d9cf0;--visit:#e8ebef;--stay:#3fbf8c;--warn:#f0a36b;--focus:#1e2a44;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f1318;--sheet:#161b22;--ink:#e8ebef;--sub:#9aa4b1;--rule:#262d37;--soft:#1d242d;--route:#7d9cf0;--visit:#e8ebef;--stay:#3fbf8c;--warn:#f0a36b;--focus:#1e2a44;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{-webkit-tap-highlight-color:transparent;margin:0;font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;background:var(--paper);color:var(--ink);display:flex}
.panel{width:420px;flex:none;display:flex;flex-direction:column;background:var(--sheet);border-right:1px solid var(--rule);min-height:0}
.top{padding:20px 20px 14px;border-bottom:1px solid var(--rule);display:grid;gap:14px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.02em;color:var(--sub);text-transform:uppercase}
h1{margin:4px 0 0;font-size:20px;line-height:1.3;font-weight:700;text-wrap:balance}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.days button{all:unset;cursor:pointer;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.days button:focus-visible,.views button:focus-visible,.card:focus-visible,summary:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.days .d1{font:600 11px/1 var(--mono);color:var(--sub);letter-spacing:.04em}
.days .d2{font-weight:700;font-size:15px}
.days .d3{font-size:12px;color:var(--sub);text-wrap:balance}
.days button.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.days button.on .d1,.days button.on .d3{color:inherit;opacity:.75}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.meta b{color:var(--ink);font-weight:600}
.views{margin-left:auto;display:flex;background:var(--soft);border-radius:8px;padding:2px}
.views button{all:unset;cursor:pointer;font-size:13px;padding:8px 14px;border-radius:6px;color:var(--sub)}
.views button.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rail{flex:1;overflow:auto;padding:10px 0 24px;position:relative}
.rail{background:var(--paper)}
/* 리스트: 방문지·숙소는 카드, 이동은 카드 사이에 접힌 한 줄 */
.card{margin:0 12px;display:grid;grid-template-columns:30px 1fr;gap:12px;padding:14px 14px 14px 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;cursor:pointer}
.card+.card{margin-top:10px}
.card.on{border-color:var(--route);box-shadow:0 0 0 1px var(--route)}
.badge{width:30px;height:30px;border-radius:50%;background:var(--visit);color:var(--sheet);font:700 14px/30px var(--sans);text-align:center}
.card.stay .badge{background:var(--stay);color:#fff;font:700 12px/30px var(--sans)}
.card.unc .badge{outline:2px dashed var(--warn);outline-offset:2px}
.cbody{min-width:0}
.when{font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.when .tag{margin:0}
.name{font-size:17px;font-weight:700;line-height:1.35;margin-top:2px;text-wrap:balance}
.addr{font-size:13px;color:var(--sub);margin-top:4px}
.card .nav{margin-top:10px}
.leg{position:relative;margin:0 12px;padding:2px 0 2px 54px}
.leg::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:3px;border-radius:2px;background:var(--route);opacity:.35}
.leg.ktx::before{background:repeating-linear-gradient(var(--sub) 0 5px,transparent 5px 10px);opacity:.7}
.leg.none::before{background:var(--rule);opacity:1}
.leg summary,.leg .sum{list-style:none;cursor:pointer;padding:8px 0}
.leg summary::-webkit-details-marker{display:none}
.l1{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.lt{font:600 12.5px var(--mono);color:var(--sub);min-width:40px;font-variant-numeric:tabular-nums}
.lx{flex:1;min-width:0;font-weight:500}
.leg.none .lx{color:var(--sub);font-weight:400}
.leg.on .lx{color:var(--route)}
.chev{flex:none;width:8px;height:8px;margin:0 4px;border-right:1.5px solid var(--sub);border-bottom:1.5px solid var(--sub);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
details[open] .chev{transform:translateY(1px) rotate(-135deg)}
.l2{margin:5px 0 0 48px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.le{font-size:12.5px;font-weight:500;color:var(--route);margin-left:3px;font-variant-numeric:tabular-nums}
.steps{margin:0 0 10px 48px;padding:10px 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;display:grid;gap:8px;font-size:13px;line-height:1.6;color:var(--sub)}
.rail>:first-child{margin-top:4px}
.tag{display:inline-block;margin-left:6px;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;vertical-align:1px}
.tag.dur{background:var(--soft);color:var(--sub)}
.tag.unc{color:var(--warn);border:1px dashed var(--warn)}
.chip{display:inline-block;font:600 11.5px/18px var(--mono);padding:0 6px;border-radius:9px;background:var(--ink);color:var(--sheet);margin:0 1px}
.chip.l1{background:var(--l1);color:#fff}.chip.l2{background:var(--l2);color:#fff}.chip.l4{background:var(--l4);color:#fff}
.chip.ktx{background:transparent;color:var(--ink);border:1.5px solid var(--ktx);line-height:15px}
.nav{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.nav a{text-decoration:none;font-weight:500;font-size:13px;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--rule);color:var(--ink);background:var(--sheet);display:inline-flex;align-items:center;gap:5px}
.nav a:hover{border-color:var(--sub)}
.nav a::before{content:"";width:7px;height:7px;border-radius:50%}
.nav a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.nav .nv::before{background:#03c75a}.nav .kk::before{background:#f2c500}
.nav span{font:500 12px var(--sans);color:var(--sub);margin-right:2px}
.legend{padding:10px 20px;border-top:1px solid var(--rule);font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 14px}
.legend i{display:inline-block;vertical-align:-2px;margin-right:5px}
#map{flex:1;min-width:0;background:var(--soft)}
/* 지도 위 마커 */
.mk{display:flex;align-items:center;gap:6px;transform:translate(-11px,-11px);white-space:nowrap;cursor:pointer}
.mk b{width:22px;height:22px;border-radius:50%;background:#141a22;color:#fff;font:700 12px/22px var(--sans);text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
.mk.stay b{background:#0f7a55;font-size:11px}
.mk.unc b{box-shadow:0 0 0 2px #fff,0 0 0 4px #a2470e}
#map.far .mk span{display:none}
.mk span{font:600 12px/1 var(--sans);color:#141a22;background:#fff;padding:4px 7px;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mk span em{font:600 11px var(--sans);font-variant-numeric:tabular-nums;font-style:normal;color:#5b6573;margin-right:5px}
.dot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #2b59c3;box-sizing:border-box;transform:translate(-6px,-6px)}
.iw{padding:10px 12px;width:260px;background:#fff;color:#141a22;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);font:13px/1.5 var(--sans)}
.iw b{display:block;margin-bottom:2px}
.mapbar{display:none}
@media (max-width:760px){
 .mapbar{display:flex;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;z-index:20;gap:6px;align-items:flex-start;pointer-events:none}
 .mapbar>*{pointer-events:auto}
 .mapbar .pills{display:none;flex-wrap:wrap;gap:6px}
 body.full .mapbar .pills{display:flex}
 .mapbar .grp{display:flex;gap:4px;background:rgba(255,255,255,.96);border-radius:20px;padding:3px;box-shadow:0 1px 6px rgba(0,0,0,.2)}
 .mapbar button{all:unset;cursor:pointer;font:600 13px/1 var(--sans);font-variant-numeric:tabular-nums;padding:10px 12px;border-radius:17px;color:#141a22}
 .mapbar .grp button.on{background:#141a22;color:#fff}
 .mapbar .tog{margin-left:auto;white-space:nowrap;flex:none;background:rgba(255,255,255,.96);box-shadow:0 1px 6px rgba(0,0,0,.2);padding:12px 14px;border-radius:20px}
 .mapbar button:focus-visible{outline:2px solid #2b59c3;outline-offset:2px}
 body.full #map{height:100vh;height:100svh}
 body.full .panel{display:none}
 html,body{height:auto}
 body{flex-direction:column}
 #map{order:-1;flex:none;position:sticky!important;top:env(safe-area-inset-top,0px);z-index:5;height:40vh;height:40svh;border-bottom:1px solid var(--rule)}
 .panel{width:auto;border-right:0}
 .rail{overflow:visible}
 .top{padding:14px 16px 12px}
 .legend{padding-inline:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

 {time:'14:13',title:'나주역 도착',kind:T,region:'naju',ll:[35.01435,126.71664],detail:''},
 {time:'14:30',title:'자택 방문',kind:N,detail:'환복 및 차량'},
 {time:'15:00',title:'학교 출근 · 한국에너지공과대학교',kind:S,badge:'학',region:'naju',ll:[35.01060,126.80332],detail:'나주시 켄텍길 21'},
 {time:'16:00',title:'ELX',kind:V,region:'naju',detail:'30분 소요\n위치 미확인 - 지도에 핀 없음'},
 {time:'17:00',title:'한전 KDN',kind:V,region:'naju',ll:[35.02231,126.78288],detail:'30분 소요\n나주시 빛가람로 661'},
 {time:'17:30',title:'복귀',kind:N,detail:''}
]}];
const REGION={seoul:'수도권',naju:'나주'};
// 길찾기: 방문지·숙소·KTX역을 기점으로, 바로 앞 기점에서 출발 (KTX 구간은 제외, 날짜를 넘어 이어짐)
const place=s=>/KTX|역 도착/.test(s.title)?s.title.split(' ')[0]:s.title.replace(/^(숙소 이동|숙소|학교 출근) · /,'').replace(/\s*\(.*?\)/g,'').replace(/[,\/]/g,' ').trim();
{let prev=null;DAYS.forEach(D=>D.stops.forEach(s=>{if(!s.ll||!(s.kind===V||s.kind===S||/KTX|역 도착/.test(s.title)))return;if(prev&&!prev.dash)s.from=prev;prev=s;}));}
const naverUrl=(a,b)=>`nmap://route/public?slat=${a.ll[0]}&slng=${a.ll[1]}&sname=${encodeURIComponent(place(a))}&dlat=${b.ll[0]}&dlng=${b.ll[1]}&dname=${encodeURIComponent(place(b))}&appname=${encodeURIComponent(location.origin)}`;
const kakaoUrl=(a,b)=>`https://map.kakao.com/link/by/traffic/${encodeURIComponent(place(a))},${a.ll[0]},${a.ll[1]}/${encodeURIComponent(place(b))},${b.ll[0]},${b.ll[1]}`;
const DATES=[['10.19','월','판교 · 하남 · 관악 · 광명'],['10.20','화','안양 · 성북 · 성수'],['10.21','수','신촌 · 용산 · 나주']];
const LINE={'1':'l1','2':'l2','4':'l4'};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// 상세 문구 속 버스·지하철·KTX 표기를 칩으로
const chipify=t=>esc(t)
 .replace(/((?:\d{1,4}(?:-\d{1,2})?)(?:, \d{1,4}(?:-\d{1,2})?)*)번/g,(_,g)=>g.split(', ').map(n=>`<span class="chip">${n}</span>`).join(' '))
 .replace(/(\d)호선/g,(_,n)=>`<span class="chip ${LINE[n]||''}">${n}호선</span>`)
 .replace(/KTX/g,'<span class="chip ktx">KTX</span>')
 .replace(/^\* ?/,'');
const hasMap=!!window.naver&&!!naver.maps;
const N_=hasMap?naver.maps:null,P=ll=>new N_.LatLng(ll[0],ll[1]);
const map=hasMap?new N_.Map('map',{center:P([37.5,127]),zoom:11,zoomControl:matchMedia('(min-width:761px)').matches,zoomControlOptions:{position:N_.Position.TOP_RIGHT}}):null;
const iw=hasMap?new N_.InfoWindow({borderWidth:0,backgroundColor:'transparent',disableAnchor:true,pixelOffset:new N_.Point(0,-16)}):null;
if(hasMap){const el=document.getElementById('map'),z=()=>el.classList.toggle('far',map.getZoom()<12);N_.Event.addListener(map,'zoom_changed',z);z();}
const list=document.getElementById('list'),tabs=document.getElementById('tabs'),meta=document.getElementById('meta');
let day=0,region=null,overlays=[];
const pills=document.getElementById('pills'),tog=document.getElementById('tog');
function render(d){
 day=d;overlays.forEach(o=>o.setMap(null));overlays=[];iw&&iw.close();list.innerHTML='';
 const stops=DAYS[d].stops,pinned=stops.filter(s=>s.ll);
 if(hasMap)for(let i=0;i<pinned.length-1;i++)overlays.push(new N_.Polyline({map,path:[P(pinned[i].ll),P(pinned[i+1].ll)],strokeColor:pinned[i].dash?'#5b6573':'#2b59c3',strokeWeight:pinned[i].dash?3:4,strokeOpacity:.8,strokeStyle:pinned[i].dash?'shortdash':'solid',strokeLineCap:'round'}));
 let n=0;
 stops.forEach(s=>{
  const num=s.kind===V?++n:null,lab=num||s.badge||'숙';
  const card=s.kind===V||s.kind===S;
  const isEst=l=>/^\*? ?(이동 )?약 ?\d+분|^\* ?\d+분/.test(l);
  const lines=(s.detail||'').split('\n').filter(Boolean);
  const dur=card&&lines[0]&&/소요$/.test(lines[0])?lines.shift().replace(' 소요',''):'';
  const est=(lines.find(isEst)||'').replace(/^\* ?/,'').replace(/ 소요/,'');
  const steps=lines.filter(l=>!isEst(l));
  const nav=s.from?`<div class="nav"><span>길찾기</span><a class="nv" href="${naverUrl(s.from,s)}" title="${esc(place(s.from))}에서 출발">네이버 지도</a><a class="kk" href="${kakaoUrl(s.from,s)}" target="_blank" rel="noopener" title="${esc(place(s.from))}에서 출발">카카오맵</a></div>`:'';
  const row=document.createElement('div');
  if(card){
   row.className=`card${s.kind===S?' stay':''}${s.unc?' unc':''}`;
   row.innerHTML=`<div class="badge">${lab}</div><div class="cbody"><div class="when">${s.time}${dur?` · ${dur}`:''}${s.unc?'<span class="tag unc">위치 추정</span>':''}</div><div class="name">${esc(s.title)}</div>${steps.map(l=>`<div class="addr">${chipify(l)}</div>`).join('')}${nav}</div>`;
  }else{
   const chips=[...new Set((chipify(steps.join(' ')).match(/<span class="chip[^"]*">[^<]*<\/span>/g)||[]))].join('');
   const l1=`<div class="l1"><span class="lt">${s.time}</span><span class="lx">${esc(s.title.replace(/^이동 · /,''))}</span>${steps.length?'<i class="chev"></i>':''}</div>${chips||est?`<div class="l2">${chips}${est?`<span class="le">${esc(est)}</span>`:''}</div>`:''}`;
   row.className=`leg${s.dash?' ktx':''}${s.kind===N?' none':''}`;
   row.innerHTML=steps.length?`<details><summary>${l1}</summary><div class="steps">${steps.map(l=>`<div>${chipify(l)}</div>`).join('')}</div></details>`:`<div class="sum">${l1}</div>`;
  }
  if(card&&s.ll)row.tabIndex=0;
  row.querySelectorAll('.nav a').forEach(a=>a.onclick=e=>e.stopPropagation());
  const det=row.querySelector('details');
  if(det)det.querySelector('summary').onclick=e=>{e.preventDefault();det.open=!det.open;};
  list.appendChild(row);
  if(!s.ll||!hasMap)return;
  const big=s.kind===V||s.kind===S;
  const m=new N_.Marker({map,position:P(s.ll),zIndex:big?100:10,icon:{content:big
   ?`<div class="mk${s.kind===S?' stay':''}${s.unc?' unc':''}"><b>${lab}</b><span><em>${s.time}</em>${esc(s.title.replace(/^(숙소|학교 출근) · /,''))}</span></div>`
   :'<div class="dot"></div>'}});
  overlays.push(m);
  const html=`<div class="iw"><b>${s.time} · ${esc(s.title)}</b>${esc(s.detail).replace(/\n/g,'<br>')}</div>`;
  const open=()=>{iw.setContent(html);iw.open(map,m);list.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));row.classList.add('on');};
  const go=()=>{map.morph(P(s.ll),Math.max(map.getZoom(),15));open();};
  row.onclick=go;if(card)row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  N_.Event.addListener(m,'click',()=>{open();row.scrollIntoView({block:'nearest',behavior:'smooth'});});
 });
 tabs.innerHTML=DAYS.map((x,i)=>`<button class="${i===d?'on':''}" onclick="render(${i})"><span class="d1">DAY ${i+1}</span><span class="d2">${DATES[i][0]} (${DATES[i][1]})</span><span class="d3">${DATES[i][2]}</span></button>`).join('');
 const visits=stops.filter(s=>s.kind===V).length,times=stops.map(s=>s.time).filter(t=>/^\d/.test(t));
 const regions=[...new Set(pinned.map(s=>s.region))].sort((a,b)=>(a==='seoul'?-1:1)-(b==='seoul'?-1:1));
 meta.innerHTML=`<span>방문 <b>${visits}곳</b></span><span><b>${times[0]}</b> – <b>${times[times.length-1]}</b></span>`+
  (regions.length>1?`<div class="views" id="views">${regions.map((r,i)=>`<button data-r="${r}" onclick="fit('${r}')">${REGION[r]}</button>`).join('')}</div>`:'');
 fit(regions[0]);
}
function fit(r){
 region=r;
 const regs=[...new Set(DAYS[day].stops.filter(s=>s.ll).map(s=>s.region))].sort((a,b)=>(a==='seoul'?-1:1)-(b==='seoul'?-1:1));
 document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
 pills.innerHTML=`<span class="grp">${DATES.map((x,i)=>`<button class="${i===day?'on':''}" onclick="render(${i})">${x[0]}</button>`).join('')}</span>`+
  (regs.length>1?`<span class="grp">${regs.map(x=>`<button class="${x===r?'on':''}" onclick="fit('${x}')">${REGION[x]}</button>`).join('')}</span>`:'');
 if(!hasMap)return;
 const pts=DAYS[day].stops.filter(s=>s.ll&&s.region===r).map(s=>P(s.ll));
 const b=new N_.LatLngBounds(pts[0],pts[0]);pts.forEach(p=>b.extend(p));
 map.fitBounds(b,{top:60,right:60,bottom:40,left:40});
}
tog.onclick=()=>{
 const f=document.body.classList.toggle('full');
 tog.textContent=f?'목록 보기':'지도 크게';
 scrollTo(0,0);
 if(hasMap){const el=document.getElementById('map');map.setSize(new N_.Size(el.offsetWidth,el.offsetHeight));fit(region);}
};
render(Math.max(0,['2026-10-19','2026-10-20','2026-10-21'].indexOf(new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}))));
</script>
</body>
</html>
