<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOU 서명 출장 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 귀여운 출장 지도: 도트 배경 + 둥근 카드, 날짜마다 색(--day)이 바뀜. 폰은 지도 위, 리스트 아래. */
:root{
 --paper:#f5f6fb;--sheet:#ffffff;--ink:#2b2e3b;--sub:#7b8094;--rule:#e7e9f1;--soft:#eef0f8;
 --day:#f2643d;--stay:#22a86a;--warn:#e8590c;
 --l1:#0052a4;--l2:#00a84d;--l4:#00a5de;--ktx:#7b8094;
 --tint:color-mix(in srgb,var(--day) 13%,var(--sheet));
 --day-ink:color-mix(in srgb,var(--day) 78%,var(--ink));
 --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --cute:"Jua",var(--sans);
 --mono:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15171f;--sheet:#1e2130;--ink:#eceefa;--sub:#a4a9c0;--rule:#2d3145;--soft:#262a3d;--stay:#3fd08b;--warn:#ff8a4c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#15171f;--sheet:#1e2130;--ink:#eceefa;--sub:#a4a9c0;--rule:#2d3145;--soft:#262a3d;--stay:#3fd08b;--warn:#ff8a4c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{-webkit-tap-highlight-color:transparent;margin:0;font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink);display:flex;background:var(--paper)}
.panel{width:420px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.top{padding:22px 18px 14px;display:grid;gap:14px}
.eyebrow{font:600 13px/1 var(--sans);color:var(--sub)}
h1{margin:8px 0 0;font:400 27px/1.25 var(--cute);letter-spacing:-.01em;text-wrap:balance}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.days button{all:unset;cursor:pointer;background:var(--sheet);border-radius:18px;padding:10px 12px;display:grid;gap:3px;box-shadow:0 1px 0 var(--rule);transition:transform .15s}
.days button:active{transform:scale(.97)}
.days .d1{font:400 13px/1 var(--cute);color:var(--c)}
.days .d2{font:400 18px/1.2 var(--cute)}
.days .d3{font-size:11.5px;color:var(--sub);text-wrap:balance}
.days button.on{background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#000)}
.days button.on .d1,.days button.on .d3{color:#fff;opacity:.9}
.days button:focus-visible,.views button:focus-visible,.card:focus-visible,summary:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.meta b{color:var(--ink);font-weight:700}
.views{margin-left:auto;display:flex;background:var(--sheet);border-radius:999px;padding:3px;box-shadow:0 2px 0 var(--rule)}
.views button{all:unset;cursor:pointer;font:600 13px/1 var(--sans);padding:9px 14px;border-radius:999px;color:var(--sub)}
.views button.on{background:var(--day);color:#fff}
.rail{flex:1;overflow:auto;padding:6px 0 24px;position:relative}
/* 리스트: 방문지·숙소는 카드, 이동은 카드 사이 점선 위의 한 줄 */
.card{margin:0 14px;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:15px 15px 15px 13px;background:var(--sheet);border-radius:20px;cursor:pointer;box-shadow:0 1px 0 var(--rule)}
.card+.card{margin-top:12px}
.card.on{box-shadow:0 0 0 2.5px var(--day),0 8px 20px color-mix(in srgb,var(--day) 25%,transparent)}
.badge{width:36px;height:36px;border-radius:50%;background:var(--day);color:#fff;font:400 19px/36px var(--cute);text-align:center;box-shadow:0 3px 0 color-mix(in srgb,var(--day) 70%,#000)}
.card.stay .badge{background:var(--stay);box-shadow:0 3px 0 color-mix(in srgb,var(--stay) 70%,#000)}
.card.unc .badge{outline:2px dashed var(--warn);outline-offset:3px}
.card.on .badge{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.18) rotate(-6deg)}}
.cbody{min-width:0}
.when{font-size:12.5px;font-weight:700;color:var(--sub);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.when .tag{margin:0}
.name{font:400 19px/1.3 var(--cute);margin-top:3px;text-wrap:balance}
.addr{font-size:13px;color:var(--sub);margin-top:5px}
.card .nav{margin-top:12px}
.leg .nav{margin:0 0 8px 48px}
.leg{position:relative;margin:0 14px;padding:4px 0 4px 56px}
.leg::before{content:"";position:absolute;left:30px;top:0;bottom:0;border-left:3px dotted var(--day);opacity:.55}
.leg.ktx::before{border-left:3px dashed var(--sub);opacity:.6}
.leg.none::before{border-left-color:var(--rule);opacity:1}
.leg summary,.leg .sum{list-style:none;cursor:pointer;padding:8px 0}
.leg summary::-webkit-details-marker{display:none}
.l1{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.lt{font-weight:700;font-size:12.5px;color:var(--sub);min-width:40px}
.lx{flex:1;min-width:0;font-weight:600}
.leg.none .lx{color:var(--sub);font-weight:500}
.leg.on .lx{color:var(--day-ink)}
.chev{flex:none;width:8px;height:8px;margin:0 4px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);border-radius:1px;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open] .chev{transform:translateY(1px) rotate(-135deg)}
.l2{margin:6px 0 0 48px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.le{font-size:12px;font-weight:700;color:var(--day-ink);background:var(--tint);padding:3px 9px;border-radius:999px;margin-left:3px}
.steps{margin:2px 0 10px 48px;padding:12px 14px;background:var(--sheet);border-radius:14px;display:grid;gap:8px;font-size:13px;line-height:1.6;color:var(--sub);box-shadow:0 2px 0 var(--rule)}
.rail>:first-child{margin-top:4px}
.tag{display:inline-block;margin-left:6px;font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;vertical-align:1px}
.tag.unc{color:var(--warn);border:1.5px dashed var(--warn)}
.chip{display:inline-block;font:700 11.5px/19px var(--sans);padding:0 8px;border-radius:999px;background:var(--ink);color:var(--sheet);margin:0 1px}
.chip.l1{background:var(--l1);color:#fff}.chip.l2{background:var(--l2);color:#fff}.chip.l4{background:var(--l4);color:#fff}
.chip.ktx{background:transparent;color:var(--ink);border:1.5px solid var(--ktx);line-height:16px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nav a{text-decoration:none;font-weight:600;font-size:13px;min-height:36px;padding:0 14px;border-radius:999px;color:var(--ink);background:var(--soft);display:inline-flex;align-items:center;gap:6px}
.nav a:active{transform:scale(.97)}
.nav a::before{content:"";width:8px;height:8px;border-radius:50%}
.nav a:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.nav .nv::before{background:#03c75a}.nav .kk::before{background:#f2c500}
.legend{padding:12px 18px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 14px}
.legend i{display:inline-block;vertical-align:-2px;margin-right:5px;font-style:normal}
#map{flex:1;min-width:0;background:#f3f1ec}
#map img[src*="//nrbe."]{filter:saturate(.45) contrast(.82) brightness(1.08)}
/* 지도 위 마커 */
.mk{display:flex;align-items:center;gap:5px;transform:translate(-16px,-38px);white-space:nowrap;cursor:pointer}
.mk .pin{position:relative;width:32px;height:32px;flex:none}
.mk .pin::after{content:"";position:absolute;left:50%;top:36px;width:16px;height:6px;margin-left:-8px;border-radius:50%;background:rgba(40,30,20,.22);filter:blur(1px);z-index:-1}
.mk.on .pin::before{content:"";position:absolute;left:50%;top:38px;width:44px;height:18px;margin:-9px 0 0 -22px;border-radius:50%;border:2.5px solid var(--day);animation:ring 1.5s ease-out infinite;z-index:-1}
.mk.on .pin b{animation:hop .9s ease-in-out infinite}
.mk.on{z-index:5;position:relative}
.mk .halo{position:absolute;left:50%;top:37px;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--day);opacity:.16;z-index:-2}
.mk.stay .halo{background:var(--stay)}
.mk.on span{display:none}
.flag{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font:400 12px/1 var(--cute);text-decoration:none;color:#fff;background:#2b2e3b;padding:5px 8px 4px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.flag::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-top-color:#2b2e3b;border-bottom:0}
.mk b{display:block;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--day);border:3px solid #fff;box-shadow:-2px 3px 6px rgba(0,0,0,.25);box-sizing:border-box}
.mk b i{display:block;transform:rotate(45deg);font:400 16px/26px var(--cute);font-style:normal;color:#fff;text-align:center}
.mk.stay b{background:var(--stay)}
.mk.unc b{border-style:dashed;border-color:var(--warn)}
.veh{font-size:24px;line-height:1;transform:translate(-12px,-14px);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));pointer-events:none}
.veh.east{transform:translate(-12px,-14px) scaleX(-1)}
#map.far .mk span{display:none}
.mk span{position:relative;margin-left:4px;font:400 14px/1 var(--cute);color:#2b2e3b;background:#fff;padding:7px 11px 6px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.mk span::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.mk span em{font:700 11px var(--sans);font-style:normal;color:var(--day);margin-right:5px}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes hop{0%,100%{transform:rotate(-45deg) translate(0,0)}50%{transform:rotate(-45deg) translate(4px,-4px)}}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--day);box-sizing:border-box;transform:translate(-5px,-5px)}
.iwrap{position:relative;width:0;height:0}
.iw{position:absolute;left:-130px;top:14px;padding:12px 14px;width:260px;background:#fff;color:#2b2e3b;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.2);font:13px/1.55 var(--sans);animation:rise .25s ease-out both}
.iw::after{content:"";position:absolute;left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.iw b{display:block;margin-bottom:3px;font:400 16px/1.3 var(--cute);color:var(--day-ink)}
.grab{display:none}
.scroller{flex:1;min-height:0;display:flex;flex-direction:column}
@media (max-width:760px){
 html,body{height:100%;overflow:hidden}
 body{display:block}
 #map{position:fixed!important;inset:0;width:100%;height:100%}
 /* 바텀시트: 손잡이로 끌어 올리고 내림. 세 단계(날짜 탭만 / 절반 / 거의 전체) */
 .panel{position:fixed;left:0;right:0;bottom:0;z-index:10;width:auto;height:calc(100% - 48px);border-right:0;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(40,50,90,.18);transform:translateY(70%);transition:transform .3s cubic-bezier(.2,.85,.25,1);will-change:transform}
 .panel.drag{transition:none}
 .grab{display:grid;place-items:center;height:28px;flex:none;cursor:grab;touch-action:none}
 .grab i{width:42px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--sub) 45%,transparent)}
 .grab:focus-visible{outline:2px solid var(--day);outline-offset:-4px;border-radius:22px 22px 0 0}
 .scroller{overflow:auto;overscroll-behavior:contain}
 .rail{overflow:visible;flex:none}
 .top{padding:0 14px 12px;touch-action:none}
 .legend{padding-inline:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
 .locbtn{margin:10px 10px 0 0}
}
/* 방문 완료 */
.card{position:relative}
.card .when{padding-right:78px}
.done-btn{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;font:700 12px/1 var(--sans);padding:8px 11px;border-radius:999px;color:var(--sub);background:var(--soft);display:inline-flex;align-items:center;gap:5px}
.done-btn::before{content:"";width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(-45deg)}
.done-btn:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.card.done .done-btn{background:var(--day);color:#fff}
.card.done .badge,.mk.done b{background:#9ea3b5;box-shadow:none}
.card.done .badge{font-size:0}
.card.done .badge::after,.mk.done b i::after{content:"";display:block;width:12px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg);margin:11px auto 0}
.mk.done b i{font-size:0;height:26px;position:relative}
.mk.done b i::after{position:absolute;left:50%;top:50%;margin:-6px 0 0 -6px}
.card.done .name,.card.done .addr{color:var(--sub)}
.mk.done span{color:#7b8094}
.mk.done .halo{opacity:.07}
/* 애니메이션: 리스트 차례로 떠오르기, 핀 떨어지기, 제목 버스 흔들기 */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes drop{0%{opacity:0;transform:translateY(-22px) scale(.5)}60%{opacity:1;transform:translateY(3px) scale(1.12)}80%{transform:translateY(-1px) scale(.97)}}
@keyframes fade{from{opacity:0}}
.card,.leg{animation:rise .5s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i,0) * 45ms)}
.mk .pin{animation:drop .55s ease-out both;animation-delay:var(--d,0ms)}
.mk span{animation:fade .4s both;animation-delay:calc(var(--d,0ms) + 250ms)}
.dot{animation:fade .4s both}
.locbtn{all:unset;cursor:pointer;width:44px;height:44px;margin:0 10px 14px 0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;place-items:center;color:#2b2e3b}
.locbtn.on{color:#2f7cf6}
.locbtn.busy svg{animation:spin 1s linear infinite}
.locbtn:focus-visible{outline:2px solid #2f7cf6;outline-offset:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.me{position:relative;width:18px;height:18px;transform:translate(-9px,-9px)}
.me i{position:absolute;inset:0;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.me::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:#2f7cf6;opacity:.25;animation:mepulse 2s ease-out infinite}
@keyframes mepulse{from{transform:scale(.4);opacity:.45}to{transform:scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#2b2e3b;color:#fff;font:600 13px/1.4 var(--sans);padding:10px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="panel" id="sheet">
 <div class="grab" id="grab" role="button" tabindex="0" aria-label="목록 올리기·내리기"><i></i></div>
 <div class="scroller" id="scroller">
 <div class="top" id="top">
  <div><div class="eyebrow">MOU 협약서 서명 출장 · 10.19 – 10.21</div><h1>3일간 11곳 도는 순회 일정</h1></div>
  <div class="days" id="tabs"></div>
  <div class="meta" id="meta"></div>
 </div>
 <div class="rail" id="list"></div>
 <div class="legend">
  <span><i class="chip" style="background:var(--day);color:#fff">1</i>방문기관</span>
  <span><i class="chip" style="background:var(--stay);color:#fff">숙</i>숙소·출근지</span>
  <span><i style="width:10px;height:10px;border-radius:50%;border:2.5px solid var(--day);box-sizing:border-box"></i>환승</span>
  <span>점선 = 위치 추정</span>
 </div>
 </div>
</section>
<div id="map"></div>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=u10c0yzn3f"></script>
<script>
const V='V',T='T',S='S',N='N';
const DAYS=[
{name:'1일차 · 10/19(월)',stops:[
 {time:'6:48',title:'나주역 출발 (KTX)',kind:T,region:'naju',dash:true,ll:[35.01435,126.71664],detail:'KTX 나주 6:48 → 동탄 8:37'},
 {time:'8:37',title:'동탄역 도착',kind:T,region:'seoul',ll:[37.20036,127.09558],detail:'포스코더샵.롯데캐슬 승차 - 6003번 (배차 10분 내외) → 금토천교 하차\n약 45분 소요'},
 {time:'9:30',title:'바이텍정보통신',kind:V,region:'seoul',ll:[37.40048,127.10685],detail:'30분 소요\n성남시 분당구 대왕판교로 660 유스페이스1 B동 1102호 (금토천교 하차 후 도보)'},
 {time:'10:00',title:'이동 · H스퀘어.삼환하이펙스 → 야탑고교',kind:T,region:'seoul',ll:[37.40187,127.10981],detail:'H스퀘어.삼환하이펙스 승차 - 82번 (배차 20분 내외) → 야탑고교.예비군훈련장 하차\n약 50분 소요'},
 {time:'11:00',title:'한국전자기술연구원 (KETI)',kind:V,region:'seoul',ll:[37.40394,127.16050],detail:'30분 소요\n성남시 분당구 새나리로 25'},
 {time:'11:30',title:'이동 · 선경아파트 → 야탑역',kind:T,region:'seoul',ll:[37.41177,127.12816],detail:'선경아파트 승차 - 50, 57번 (배차 10분 내외) → 야탑역.종합버스터미널(후면) 하차\n야탑역.종합버스터미널(광역버스) 승차 - 3000번 (배차 20분 내외) → 황산사거리.하남수산물시장 하차\n약 80분 소요'},
 {time:'환승',title:'황산사거리.하남수산물시장 하차',kind:T,region:'seoul',ll:[37.5502,127.1859],detail:'3000번 하차 후 도보'},
 {time:'13:00',title:'삼성물산 (건설부문)',kind:V,region:'seoul',ll:[37.54879,127.17523],detail:'30분 소요\n서울 강동구 상일로6길 26'},

   if(!meM)meM=new N_.Marker({map,position:ll,zIndex:300,clickable:false,icon:{content:'<div class="me"><i></i></div>'}});else meM.setPosition(ll);
   btn.classList.remove('busy');btn.classList.add('on');
   if(firstFix){firstFix=false;map.morph(ll,Math.max(map.getZoom(),15));}
  },e=>{
   btn.classList.remove('busy','on');if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;
   toast(e.code===1?'위치 권한을 허용해 주세요 (설정 > Safari > 위치)':'지금 위치를 찾을 수 없어요. 잠시 후 다시 눌러 주세요');
  },{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
 });
});
// 바텀시트 (폰): 손잡이나 머리 부분을 끌어 세 단계로 맞춤
const sheet=document.getElementById('sheet'),grab=document.getElementById('grab'),scroller=document.getElementById('scroller'),topEl=document.getElementById('top');
let sheetState='peek',curY=0,suppress=0,drag=null;
function peekVisible(){const r=tabs.getBoundingClientRect(),sr=sheet.getBoundingClientRect();return Math.round(r.bottom-sr.top+scroller.scrollTop+14);}
function snaps(){const H=sheet.offsetHeight;return {peek:Math.max(0,H-peekVisible()),half:Math.max(0,H-Math.round(innerHeight*.55)),full:0};}
function setSheet(st,anim=true){
 if(!mobile.matches){sheet.style.transform='';return;}
 sheetState=st;curY=snaps()[st];sheet.classList.toggle('drag',!anim);sheet.style.transform=`translateY(${curY}px)`;
 if(st==='peek')scroller.scrollTop=0;
 grab.setAttribute('aria-label',st==='peek'?'목록 올리기':'목록 내리기');
}
function onDown(e){if(!mobile.matches)return;drag={y0:e.clientY,sy:curY,moved:false,id:e.pointerId,last:e.clientY,lt:e.timeStamp,v:0,el:e.currentTarget};}
function onMove(e){
 if(!drag||e.pointerId!==drag.id)return;const dy=e.clientY-drag.y0;
 if(!drag.moved){if(Math.abs(dy)<6)return;drag.moved=true;try{drag.el.setPointerCapture(e.pointerId);}catch(_){}sheet.classList.add('drag');}
 curY=Math.min(snaps().peek,Math.max(0,drag.sy+dy));sheet.style.transform=`translateY(${curY}px)`;
 const dt=e.timeStamp-drag.lt;if(dt>0)drag.v=(e.clientY-drag.last)/dt;drag.last=e.clientY;drag.lt=e.timeStamp;
}
function onUp(){
 if(!drag)return;const d=drag;drag=null;sheet.classList.remove('drag');
 if(!d.moved){if(d.el===grab)setSheet(sheetState==='peek'?'half':'peek');return;}
 suppress=Date.now()+350;
 const S=snaps(),ys=Object.entries(S);let t;
 if(d.v<-.4){const up=ys.filter(([,y])=>y<curY-1).sort((a,b)=>b[1]-a[1])[0];t=up?up[0]:'full';}
 else if(d.v>.4){const dn=ys.filter(([,y])=>y>curY+1).sort((a,b)=>a[1]-b[1])[0];t=dn?dn[0]:'peek';}
 else t=ys.sort((a,b)=>Math.abs(a[1]-curY)-Math.abs(b[1]-curY))[0][0];
 setSheet(t);
}
[grab,topEl].forEach(el=>{el.addEventListener('pointerdown',onDown);el.addEventListener('pointermove',onMove);el.addEventListener('pointerup',onUp);el.addEventListener('pointercancel',onUp);});
sheet.addEventListener('click',e=>{if(Date.now()<suppress){e.stopPropagation();e.preventDefault();}},true);
grab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSheet(sheetState==='peek'?'half':'peek');}});
addEventListener('resize',()=>setSheet(sheetState,false));
setSheet('peek',false);
render(Math.max(0,['2026-10-19','2026-10-20','2026-10-21'].indexOf(new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}))));
setSheet('peek',false);
</script>
